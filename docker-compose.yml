# Local development only. The password here is not used anywhere else.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: brispulse
      POSTGRES_PASSWORD: brispulse
      POSTGRES_DB: brispulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - brispulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brispulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brispulse-db:
